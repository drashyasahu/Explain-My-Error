spring:
  application:
    name: explainmyerror-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/explainmyerror}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:drashya@2662}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3:latest}
          temperature: 0.2

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:explainmyerror-super-secret-jwt-key-change-in-production-must-be-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  rate-limit:
    analyses-per-day: ${RATE_LIMIT_ANALYSES_PER_DAY:10}

  ai:
    max-input-length: ${AI_MAX_INPUT_LENGTH:50000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.explainmyerror: DEBUG
    org.springframework.ai: INFO
